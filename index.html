<!DOCTYPE html>
<html>
<head>
<title>Thilak AI</title>
<style>
body{
font-family:Arial;
background:#0f172a;
color:white;
text-align:center;
}

.box{
margin:40px auto;
width:90%;
max-width:600px;
background:#1e293b;
padding:20px;
border-radius:15px;
}

#messages{
height:400px;
overflow:auto;
text-align:left;
}

input{
width:70%;
padding:10px;
}

button{
padding:10px;
background:#2563eb;
color:white;
border:0;
}
</style>
</head>

<body>

<div class="box">

<h2>🤖 Thilak AI</h2>

<div id="messages">
<p>Thilak AI: Hello! I am Thilak AI Assistant.</p>
</div>

<input id="msg" placeholder="Type your message">
<button onclick="send()">Send</button>

</div>

<script>

async function send(){

let input=document.getElementById("msg");
let text=input.value;

let messages=document.getElementById("messages");

messages.innerHTML += "<p>You: "+text+"</p>";

let res=await fetch("/chat",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
message:text
})
});

let data=await res.json();

messages.innerHTML += "<p>Thilak AI: "+data.reply+"</p>";

input.value="";

}

</script>

</body>
</html>
